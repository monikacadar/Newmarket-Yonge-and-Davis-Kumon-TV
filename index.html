<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kumon Newmarket TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage img,#stage video{width:100%;height:100%;object-fit:contain;background:#000}
#message{color:#fff;font-size:3vw;text-align:center;padding:5vw}
.progress{position:absolute;bottom:0;left:0;height:5px;background:#0874b9;width:0;z-index:5}
</style></head><body>
<div id="stage"><div id="message">Loading playlist...</div></div><div class="progress" id="p"></div>
<script>
const stage=document.getElementById("stage"),bar=document.getElementById("p");
let playlist=[],idx=0,timer=null,videoWatch=null,playlistSignature="";
function clearAll(){clearTimeout(timer);clearTimeout(videoWatch)}
function isImage(n){return /\.(jpg|jpeg|png)$/i.test(n)}
function isVideo(n){return /\.mp4$/i.test(n)}
function sequenceNumber(n){const m=n.match(/^\s*(\d+)/);return m?Number(m[1]):999999}
function imageSeconds(n){const b=n.replace(/\.[^.]+$/,""),nums=b.match(/\d+/g);if(!nums||nums.length<2)return 10;const s=Number(nums[nums.length-1]);return Number.isFinite(s)?Math.min(60,Math.max(5,s)):10}
function sortedValid(a){return a.filter(x=>typeof x==="string"&&(isImage(x)||isVideo(x))).sort((a,b)=>sequenceNumber(a)-sequenceNumber(b)||a.localeCompare(b))}
async function loadPlaylist(initial=false){
 try{
  const r=await fetch("playlist.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("playlist.json HTTP "+r.status);
  const data=sortedValid(await r.json()),sig=JSON.stringify(data);
  if(initial||sig!==playlistSignature){playlist=data;playlistSignature=sig;idx=0;showCurrent()}
 }catch(e){console.error(e);if(initial)stage.innerHTML='<div id="message">Playlist unavailable</div>'}
}
function next(){if(!playlist.length)return;idx=(idx+1)%playlist.length;showCurrent()}
function showCurrent(){
 clearAll();bar.style.transition="none";bar.style.width="0";
 if(!playlist.length){stage.innerHTML='<div id="message">No media in playlist</div>';return}
 const file=playlist[idx],url="playlist/"+encodeURIComponent(file);
 if(isVideo(file)){
  const v=document.createElement("video");v.src=url;v.controls=true;v.playsInline=true;v.preload="auto";v.autoplay=true;v.muted=false;v.volume=1;
  v.onended=next;v.onerror=()=>{console.error("Video failed:",file);videoWatch=setTimeout(next,2000)};
  stage.replaceChildren(v);
  const tryPlay=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>console.log("Autoplay with sound blocked; use visible Play control."))};
  if(v.readyState>=2)tryPlay();else v.oncanplay=()=>{v.oncanplay=null;tryPlay()};
 }else{
  const img=document.createElement("img");img.src=url;img.alt="";
  img.onload=()=>{const ms=imageSeconds(file)*1000;requestAnimationFrame(()=>{bar.style.transition=`width ${ms}ms linear`;bar.style.width="100%"});timer=setTimeout(next,ms)};
  img.onerror=()=>{console.error("Image failed:",file);timer=setTimeout(next,2000)};
  stage.replaceChildren(img);
 }
}
loadPlaylist(true);
setInterval(()=>loadPlaylist(false),5*60*1000);
</script></body></html>
